name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Takes the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # --ignore-scripts skips our own "prepare" build; the tests' global setup builds the admin assets.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      # The host tests spawn real processes and can hang when a cluster child leaks.
      - run: timeout 1200 pnpm test

  pack-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Not through docker compose: its default network is external and only exists on a dev machine.
      - run: docker build -f Dockerfile.dev --target pack-test -t inlay-pack-test .
      - run: timeout 600 docker run --rm --tmpfs /tmp inlay-pack-test

  image-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: timeout 900 bash scripts/image-test.sh
