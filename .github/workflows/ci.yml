name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Takes the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # --ignore-scripts skips our own "prepare" build; the tests' global setup builds the admin assets.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      # The host tests spawn real processes and can hang when a cluster child leaks.
      - run: timeout 1200 pnpm test

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      # setup-node asks for the pnpm store from the repo root, not website/: install into that store so its cache save finds it.
      - run: pnpm --dir website install --frozen-lockfile --store-dir "$(pnpm store path --silent)"
      - run: pnpm --dir website run build
      - run: pnpm --dir website run check

  pack-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Not through docker compose: its default network is external and only exists on a dev machine.
      - run: docker build -f Dockerfile.dev --target pack-test -t inlay-pack-test .
      - run: timeout 600 docker run --rm --tmpfs /tmp inlay-pack-test

  image-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: timeout 900 bash scripts/image-test.sh
