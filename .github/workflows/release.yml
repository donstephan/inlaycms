name: Release

# Pushing a tag like v0.2.0 runs CI, then publishes inlaycms@0.2.0 to npm and ghcr.io/<owner>/inlaycms:0.2.0.
# A stable tag (not a prerelease) also publishes the docs site; that job blocks nothing and nothing waits on it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whole history, so the tagged commit can be looked for on main.
          fetch-depth: 0
      # Every other job needs this one, so a tag on a commit that never reached main publishes nothing.
      - run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit that is not on main"
            exit 1
          fi
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # A prerelease (0.2.0-beta.1) goes to the "next" dist-tag so it doesn't become "latest".
          case "$version" in *-*) npm_tag=next ;; *) npm_tag=latest ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$npm_tag" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  docs:
    needs: [version, ci]
    if: needs.version.outputs.npm-tag == 'latest'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  npm:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Trusted publishing (OIDC) and provenance: no npm token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # pnpm pack runs "prepare", which builds the admin assets and dist/ from scratch.
      - run: pnpm pack --out inlaycms.tgz
      # Staged publishing and trusted publishing need a newer npm than Node 24 may bundle.
      - run: npm install -g npm@11.21.3
      # Staged: the version stays unavailable until a maintainer approves it on npmjs.com with 2FA.
      - run: npm stage publish ./inlaycms.tgz --access public --provenance --tag "${{ needs.version.outputs.npm-tag }}"

  image:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v0.2.0 → 0.2.0, 0.2 and latest; a prerelease gets only its exact version.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/inlaycms
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
