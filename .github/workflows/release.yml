name: Release

# Pushing a tag like v0.2.0 runs CI, then publishes inlaycms@0.2.0 to npm and ghcr.io/<owner>/inlaycms:0.2.0.
# A stable tag (not a prerelease) also publishes the docs site; that job blocks nothing and nothing waits on it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # A prerelease (0.2.0-beta.1) goes to the "next" dist-tag so it doesn't become "latest".
          case "$version" in *-*) npm_tag=next ;; *) npm_tag=latest ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$npm_tag" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  docs:
    needs: [version, ci]
    if: needs.version.outputs.npm-tag == 'latest'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  npm:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Trusted publishing (OIDC) and provenance: no npm token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # pnpm pack runs "prepare", which builds the admin assets and dist/ from scratch.
      - run: pnpm pack --out inlaycms.tgz
      # Staged publishing and trusted publishing need a newer npm than Node 24 may bundle.
      - run: npm install -g npm@11
      # Staged: the version stays unavailable until a maintainer approves it on npmjs.com with 2FA.
      - run: npm stage publish ./inlaycms.tgz --access public --provenance --tag "${{ needs.version.outputs.npm-tag }}"

  image:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v0.2.0 → 0.2.0, 0.2 and latest; a prerelease gets only its exact version.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inlaycms
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
